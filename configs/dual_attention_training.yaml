# Phase 9 — Dual Attention MIL training configuration (E1 only)
#
# Owner authorization (2026-09-19): E1 `da_stage_b` ONLY. E2/`da_stage_a` NOT
# authorized. No persistent embedding cache (O2). Fresh initialization (O3).
# Test evaluation NOT authorized in this phase (O4) — the run_phase9 driver
# implements a guarded `test` stage that will refuse until separately
# authorized, and the state machine starts with `test: pending`.
#
# Protocol values are the Phase 8-locked training settings (recorded in
# configs/dual_attention_config.yaml; now executed for E1).

experiment:
  id: da_stage_b
  seed: 20260918
  initialization: "fresh random (owner decision O3/D-C; no B1/B3/B4/E2/pretrained weights)"
  artifacts: "experiments/dual_attention_results/da_stage_b"
  chunk_state: "experiments/dual_attention_results/da_stage_b_chunk_state.pt"
  checkpoint: "model/dual_attention/da_stage_b/best.pt"
  state_file: "experiments/dual_attention_results/_state.json"

training:
  optimizer: "Adam"
  learning_rate: 1.0e-3
  loss: "BCEWithLogitsLoss (unweighted)"
  max_epochs: 20
  early_stopping:
    monitor: "validation bag ROC-AUC"
    patience: 5
    selection_rule: "strict improvement (> current best)"
    restore: "best validation checkpoint at completion"
  threshold: 0.5                  # fixed; never tuned
  batching: "one optimizer step per bag (349 steps/epoch)"
  augmentation: "train-only horizontal flip p=0.5 (per-instance stream, seed+2)"
  validation: "deterministic, unaugmented, materialized once"
  chunking: "detached 1-epoch chunks, bit-exact resume"

model:
  architecture: "Phase 8 DualAttentionMIL (locked): trunk 24->48->96->128 + GAP -> 128-d; stage-1 SE channel attention r=16; stage-2 Phase 7 ABMIL; Linear(128->1) raw logit"
  trainable_parameters: 184545
  state_dict_elements: 185141     # trainable + 596 BN buffers; reported separately

test:
  authorized: false               # O4: separate authorization required
  state_on_start: "pending"
  single_evaluation: true
  note: "run_phase9.py `test` stage raises unless owner-authorized via config/state; Phase 6 STEP-G record is separate and untouched"

leakage:
  splits: "frozen Phase 4 manifests; frozen test sha256 959f1cd3d9f719195ac31af1a586d7c84824af1e23698ec7616c376714112b74"
  test_access_during_training: "PROHIBITED"
